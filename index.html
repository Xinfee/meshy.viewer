<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meshy Viewer — decrypt · render · animate · convert</title>
<meta name="description" content="Pure client-side decoder for Meshy AI .meshy files and animated GLB exports: AES-256-GCM decrypt via WebCrypto, three.js rendering with skinning + animation playback, HDRI environments, export to GLB/GLTF/OBJ/STL/PLY plus texture, skeleton and animation extraction. No server, runs entirely in your browser." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🧊</text></svg>" />
<style>
  :root {
    --bg: #11141a; --panel: rgba(22, 26, 34, .92); --line: #2a3140;
    --text: #dfe6f1; --dim: #8b95a7; --accent: #5eead4; --accent2: #818cf8;
    --danger: #f87171; --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font: 14px/1.45 "Inter", "Segoe UI", system-ui, sans-serif;
    color: var(--text); background: var(--bg);
  }
  body.dragging::after {
    content: "Drop .meshy / .glb / .gltf anywhere";
    position: fixed; inset: 12px; border: 2px dashed var(--accent);
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--accent); background: rgba(94, 234, 212, .06);
    pointer-events: none; z-index: 50;
  }
  #viewport { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .brand {
    position: fixed; top: 14px; left: 18px; z-index: 10; user-select: none;
  }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: .3px; }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--dim); }
  .brand a { color: var(--dim); }

  .toolbar {
    position: fixed; top: 14px; right: 14px; z-index: 10;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
    max-width: 52vw;
  }
  .group {
    display: flex; gap: 6px; align-items: center;
    background: var(--panel); border: 1px solid var(--line);
    padding: 6px 8px; border-radius: 10px; backdrop-filter: blur(6px);
  }
  .group .label { font-size: 11px; color: var(--dim); margin-right: 2px; }
  button {
    font: inherit; color: var(--text); background: #1c2230;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 11px; cursor: pointer; transition: all .15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); color: #08221d; font-weight: 600; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08221d; font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button:disabled { opacity: .38; cursor: not-allowed; }
  input[type="file"] { display: none; }
  select {
    font: inherit; font-size: 12.5px; color: var(--text); background: #1c2230;
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; max-width: 170px;
  }
  input[type="range"] { accent-color: var(--accent); height: 4px; cursor: pointer; }

  #panel {
    position: fixed; left: 18px; bottom: 18px; z-index: 10;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; min-width: 330px; max-width: 44vw;
    backdrop-filter: blur(6px);
  }
  #panel.hidden { display: none; }
  #panel h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
  #panel .row { display: flex; gap: 8px; margin: 3px 0; font-size: 12.5px; }
  #panel .row b { color: var(--dim); font-weight: 500; min-width: 74px; flex-shrink: 0; }
  #panel .row span { color: var(--text); word-break: break-all; }

  /* animation bar */
  #animbar {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 8px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 12px; backdrop-filter: blur(6px); max-width: 92vw;
  }
  #animbar.hidden { display: none; }
  #animbar .time { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 74px; text-align: center; }
  #animbar input[type="range"] { width: 150px; }
  #speed-val { font-size: 11.5px; color: var(--dim); min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  #btn-play { min-width: 42px; font-size: 15px; line-height: 1; }

  #banner {
    position: fixed; top: 74px; left: 50%; transform: translateX(-50%); z-index: 30;
    max-width: 70vw; padding: 10px 16px; border-radius: 10px; font-size: 13px;
    background: rgba(74, 222, 128, .12); border: 1px solid rgba(74, 222, 128, .5); color: var(--ok);
    text-align: center;
  }
  #banner.error { background: rgba(248, 113, 113, .1); border-color: rgba(248, 113, 113, .55); color: var(--danger); }
  #banner.hidden { display: none; }

  #busy {
    position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    gap: 14px; align-items: center; justify-content: center;
    background: rgba(10, 12, 16, .55); backdrop-filter: blur(3px);
  }
  #busy.hidden { display: none; }
  .spinner {
    width: 42px; height: 42px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    #panel { max-width: calc(100vw - 36px); min-width: 0; }
    .toolbar { max-width: calc(100vw - 28px); }
    #animbar { flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); bottom: 12px; }
  }
</style>
</head>
<body>
  <canvas id="viewport"></canvas>

  <div class="brand">
    <h1>meshy<span>.viewer</span></h1>
    <p>decrypt · render · animate · convert — 100% client-side · <a href="FORMAT.md" target="_blank">format docs</a></p>
  </div>

  <div class="toolbar">
    <div class="group">
      <button id="btn-sample" title="Load the bundled static sample (.meshy)">Sample</button>
      <button id="btn-walk" title="Load the bundled animated demo (GLB with skin + walk cycle)">Walk demo</button>
      <button class="primary" id="btn-open">Open file…</button>
      <input type="file" id="file-input" accept=".meshy,.glb,.gltf" />
    </div>
    <div class="group">
      <span class="label">view</span>
      <button id="btn-wireframe" title="Toggle wireframe">Wireframe</button>
      <button id="btn-rotate" class="active" title="Toggle auto-rotate">Spin</button>
      <button id="btn-grid" class="active" title="Toggle grid">Grid</button>
      <button id="btn-reset" title="Reset camera">Reset</button>
    </div>
    <div class="group">
      <span class="label">env</span>
      <select id="env-select" title="Environment lighting">
        <option value="studio" selected>Studio lights</option>
        <option value="meshy">Meshy HDRI (decor shop)</option>
        <option value="custom">Custom file…</option>
      </select>
      <input type="file" id="env-input" accept=".hdr,.exr" />
      <button id="btn-envbg" title="Show environment as background">BG</button>
    </div>
    <div class="group">
      <span class="label">export</span>
      <button data-export="glb" title="glTF binary — geometry, skin, animations and textures embedded">GLB</button>
      <button data-export="gltf" title="glTF JSON (embedded buffers)">glTF</button>
      <button data-export="obj" title="Wavefront OBJ (geometry only)">OBJ</button>
      <button data-export="stl" title="Binary STL (geometry only)">STL</button>
      <button data-export="ply" title="PLY (geometry + vertex colors)">PLY</button>
    </div>
    <div class="group">
      <span class="label">extract</span>
      <button id="btn-extex" title="Extract original texture images from the GLB">Textures</button>
      <button id="btn-exskel" title="Extract skeleton hierarchy (bind pose) as JSON">Skeleton</button>
      <button id="btn-exanim" title="Extract animation keyframes as JSON">Anims</button>
    </div>
  </div>

  <div id="banner" class="hidden"></div>

  <div id="animbar" class="hidden">
    <button id="btn-play" title="Play / pause">⏸</button>
    <select id="clip-select" title="Animation clip"></select>
    <input type="range" id="timeline" min="0" max="1000" value="0" title="Timeline" />
    <span class="time" id="anim-time">0.00 / 0.00 s</span>
    <input type="range" id="speed" min="0" max="2.5" step="0.05" value="1" title="Playback speed" style="width:90px" />
    <span id="speed-val">1.00×</span>
    <button id="btn-skeleton" title="Overlay the skeleton">Bones</button>
  </div>

  <div id="panel" class="hidden">
    <h2>Model</h2>
    <div class="row"><b>file</b><span id="stat-file">—</span></div>
    <div class="row"><b>source</b><span id="stat-source">—</span></div>
    <div class="row"><b>container</b><span id="stat-container">—</span></div>
    <div class="row"><b>geometry</b><span id="stat-mesh">—</span></div>
    <div class="row"><b>rig / anim</b><span id="stat-rig">—</span></div>
    <div class="row"><b>timing</b><span id="stat-time">—</span></div>
  </div>

  <div id="busy" class="hidden">
    <div class="spinner"></div>
    <div id="busy-msg">Working…</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
